{% set name = "seawater_crm" %}
{% set version = "0.2" %}

package:
  name: {{ name|lower }}
  version: "0.2"

source:
  url: https://files.pythonhosted.org/packages/source/s/seawater_crm/seawater_crm-{{ version }}.tar.gz
  sha256: 4273e731f4498c585ce55eb4f0276115e09103abca1ce762b55b82a96de9937b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - pandas

test:
  imports:
    - seawater_crm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Certified values for seawater reference materials
  license: GPL-3.0-only
  license_file: LICENSE
  home: https://github.com/mvdh7/seawater_crm

extra:
  recipe-maintainers:
    - mvdh7
